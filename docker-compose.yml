version: "3.8"

# ============================================================
# 部署说明：
# 1. 服务器已有 nginx → 只启动 customer-service 容器
# 2. 将 nginx.conf 中的 location / 等块加入现有 nginx 配置
# 3. 现有 nginx 中 proxy_pass http://127.0.0.1:8000
# ============================================================

services:
  customer-service:
    build: .
    container_name: customer-service
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 1g
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base
      - ./.env:/app/.env:ro
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

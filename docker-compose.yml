version: "3.8"

# 客服工单系统部署

services:
  customer-service:
    build: .
    container_name: customer-service
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 2g
    ports:
      - "8080:8000"
    volumes:
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base
      - ./.env:/app/.env:ro
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
